<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100" fill="none">
  <defs>
    <linearGradient id="badgeGradRadar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#146a53"/>
      <stop offset="60%" stop-color="#0b4839"/>
      <stop offset="100%" stop-color="#052820"/>
    </linearGradient>

    <linearGradient id="radarArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7be640"/>
      <stop offset="100%" stop-color="#5bb326"/>
    </linearGradient>

    <filter id="badgeShadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#072d23" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ICON BADGE (100x100) -->
  <g transform="translate(0, 0)">
    <!-- Rounded Square Container -->
    <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#badgeGradRadar)" filter="url(#badgeShadow2)"/>
    <rect x="6.75" y="6.75" width="86.5" height="86.5" rx="23.25" fill="none" stroke="#258269" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- CONCEPT 2: ACCELEROMETER G-FORCE SENSOR ARCS -->
    <!-- Primary Outer Sensor Arc -->
    <path d="M 68 32 C 63.5 26.5 56.5 23 48.5 23 C 33.6 23 21.5 35.1 21.5 50 C 21.5 64.9 33.6 77 48.5 77 C 56.5 77 63.5 73.5 68 68" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="11" 
          stroke-linecap="round"/>

    <!-- Inner Telematics Radar Arc (Echoing MPU6500 Gyro Roll/Pitch) -->
    <path d="M 58 39 C 55 36.5 51 35 47 35 C 38.7 35 32 41.7 32 50 C 32 58.3 38.7 65 47 65 C 51 65 55 63.5 58 61" 
          fill="none" 
          stroke="url(#radarArcGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round"/>

    <!-- Kinetic Impact Arrow / Deceleration Vector -->
    <polygon points="56,50 49,44 51,48 41,48 41,52 51,52 49,56" fill="#ffffff"/>

    <!-- Concentric Target Ping Point -->
    <circle cx="68" cy="50" r="4.5" fill="#75d733"/>
  </g>

  <!-- WORDMARK: "crashsense." -->
  <g transform="translate(116, 0)">
    <text x="0" y="65" 
          fill="#132b25" 
          font-family="Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif" 
          font-size="47" 
          font-weight="800" 
          letter-spacing="-0.04em">crashsense</text>

    <!-- Lime Dot with Target Reticle -->
    <circle cx="265" cy="61" r="5.5" fill="#70c437"/>
    <path d="M 265 52 V 70 M 256 61 H 274" stroke="#70c437" stroke-width="1.2" stroke-opacity="0.35"/>
  </g>
</svg>
