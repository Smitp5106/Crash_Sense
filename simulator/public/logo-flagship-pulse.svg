<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100" fill="none">
  <defs>
    <!-- Background Gradient for Badge -->
    <linearGradient id="badgeGradPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12634e"/>
      <stop offset="50%" stop-color="#0c4a3b"/>
      <stop offset="100%" stop-color="#062e24"/>
    </linearGradient>

    <!-- Neon Pulse Gradient -->
    <linearGradient id="neonPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#72b544" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#7ee044"/>
      <stop offset="100%" stop-color="#65c728"/>
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#072d23" flood-opacity="0.25"/>
    </filter>

    <!-- Glow for the Lime Beacon -->
    <filter id="beaconGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ICON BADGE (100x100) -->
  <g transform="translate(0, 0)">
    <!-- Rounded Square Container -->
    <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#badgeGradPulse)" filter="url(#badgeShadow)"/>
    <!-- Subtle Inner Border Highlight -->
    <rect x="6.75" y="6.75" width="86.5" height="86.5" rx="23.25" fill="none" stroke="#258269" stroke-width="1.5" stroke-opacity="0.4"/>

    <!-- THE UNIQUE "C" WITH INTEGRATED TELEMETRY IMPACT PULSE -->
    <!-- Masked Base Letter C in Crisp White -->
    <path d="M 69 31 C 64 26 57 23 49 23 C 34.5 23 23 34.8 23 50 C 23 65.2 34.5 77 49 77 C 57 77 64 74 69 69" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Dynamic Impact Shockwave / ECG Pulse (Vitals + G-Force detection) -->
    <!-- The pulse cuts across the center equator with a sudden deceleration spike -->
    <path d="M 18 50 L 33 50 L 39 37 L 46 63 L 53 43 L 58 50 L 73 50" 
          fill="none" 
          stroke="#72cf32" 
          stroke-width="3.6" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#beaconGlow)"/>

    <!-- Focal Radar Ping / Telemetry Beacon Dot in Opening of C -->
    <circle cx="73" cy="50" r="4.2" fill="#75d733" filter="url(#beaconGlow)"/>
    <!-- Concentric Sensor Wave (IoT broadcast) -->
    <path d="M 77 42 C 81.5 44.5 84 47 84 50 C 84 53 81.5 55.5 77 58" 
          fill="none" 
          stroke="#72cf32" 
          stroke-width="2.2" 
          stroke-linecap="round" 
          stroke-opacity="0.85"/>
  </g>

  <!-- WORDMARK: "crashsense." -->
  <g transform="translate(116, 0)">
    <!-- "crashsense" in custom geometric bold typography -->
    <text x="0" y="65" 
          fill="#132b25" 
          font-family="Manrope, 'Segoe UI', system-ui, -apple-system, sans-serif" 
          font-size="47" 
          font-weight="800" 
          letter-spacing="-0.04em">crashsense</text>

    <!-- Unique Active Telematics Dot with Radar Rings -->
    <circle cx="265" cy="61" r="5.5" fill="#70c437"/>
    <circle cx="265" cy="61" r="9" fill="none" stroke="#70c437" stroke-width="1.4" stroke-opacity="0.45" stroke-dasharray="2 2"/>
  </g>
</svg>
